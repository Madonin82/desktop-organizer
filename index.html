<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Desktop File Organizer</title>
    <meta name="description" content="Organize Windows desktop files, icons, and shortcuts into designated folders by file type." />
    <meta property="og:title" content="Desktop File Organizer" />
    <meta property="og:description" content="Organize Windows desktop files, icons, and shortcuts into designated folders by file type." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 40px; max-width: 600px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); color: #1e293b;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript to use the Desktop File Organizer.</p>
      </div>
    </noscript>
    <script>
      if (window.location.protocol === 'file:') {
        document.body.innerHTML = `
          <div style="min-height: 100vh; background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px;">
            <div style="background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 640px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
              <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                <div style="background: #0284c7; width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px;">📁</div>
                <div>
                  <h1 style="margin: 0; font-size: 20px; font-weight: 700; color: #ffffff;">Desktop File Organizer</h1>
                  <p style="margin: 2px 0 0; font-size: 13px; color: #94a3b8;">How to run on your Windows PC</p>
                </div>
              </div>

              <div style="background: #0f172a; border-left: 4px solid #38bdf8; border-radius: 8px; padding: 14px 16px; margin-bottom: 24px; font-size: 13.5px; line-height: 1.5; color: #cbd5e1;">
                <strong>Notice:</strong> You opened <code>index.html</code> directly from your file explorer (<code>file://</code>). Web browsers block modern TypeScript / React applications from running directly without a local server.
              </div>

              <h2 style="font-size: 15px; font-weight: 600; color: #e2e8f0; margin-bottom: 12px;">Choose How You Want to Run It:</h2>

              <div style="background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 14px;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                  <span style="font-size: 14.5px; font-weight: 700; color: #38bdf8;">Option 1: Instant Native Windows App (Recommended)</span>
                  <span style="background: #0369a1; color: #e0f2fe; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px;">No Node.js needed</span>
                </div>
                <p style="font-size: 13px; color: #94a3b8; margin: 0 0 10px; line-height: 1.4;">
                  Runs directly on Windows 10 & 11 with built-in GUI, auto-desktop file detection, checkboxes, and instant move/undo!
                </p>
                <div style="background: #1e293b; padding: 10px 14px; border-radius: 6px; font-family: Consolas, monospace; font-size: 13px; color: #f1f5f9; border: 1px dashed #475569;">
                  Double-click &rarr; <strong>Organizer-Desktop-App.bat</strong>
                </div>
              </div>

              <div style="background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 18px; margin-bottom: 24px;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                  <span style="font-size: 14.5px; font-weight: 700; color: #a855f7;">Option 2: Run Full Web App Interface</span>
                  <span style="background: #581c87; color: #f3e8ff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 9999px;">Requires Node.js</span>
                </div>
                <p style="font-size: 13px; color: #94a3b8; margin: 0 0 10px; line-height: 1.4;">
                  Runs the full interactive web app with simulated desktop canvas, script generator, and folder pickers.
                </p>
                <div style="background: #1e293b; padding: 10px 14px; border-radius: 6px; font-family: Consolas, monospace; font-size: 13px; color: #f1f5f9; border: 1px dashed #475569;">
                  Double-click &rarr; <strong>run.bat</strong>
                </div>
              </div>

              <p style="font-size: 12px; color: #64748b; margin: 0; text-align: center;">
                Both files are located directly in your extracted GitHub folder.
              </p>
            </div>
          </div>
        `;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
